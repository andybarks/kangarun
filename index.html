<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Siren's Call — The Boundary Snap Challenge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{
      --stadium:#020F81;
      --stadium-2:#0a1a9e;
      --grass:#2d8a3e;
      --grass-2:#1f6b2c;
      --sherrin:#e8b73a;
      --sherrin-2:#b8201d;
      --chalk:#ffffff;
      --line:#2d3a8c;
      --warn:#ff7b3a;
      --ok:#7be07b;
    }
    *{box-sizing:border-box}
    html,body{height:100%; margin:0; -webkit-tap-highlight-color:transparent;}
    body{
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color:#eaf0ff;
      background:
        radial-gradient(1400px 900px at 80% -10%, #1f3bd0 0%, var(--stadium) 40%, #01083a 100%) fixed;
      overflow-x:hidden;
    }
    .arcade { font-family: "Impact","Haettenschweiler","Arial Narrow Bold",sans-serif; letter-spacing:1px; }
    .panel{
      background: linear-gradient(180deg, rgba(10,22,90,.85), rgba(4,10,52,.92));
      border:1px solid #2a3aa0;
      border-radius: 16px;
      box-shadow: 0 12px 38px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);
    }
    .pill{ background:#0a122c; border:1px solid #2a3aa0; border-radius:999px; padding:5px 12px; font-size:13px; }
    .pill b{ color:var(--sherrin); }
    .btn{
      appearance:none; border:1px solid #3247c2; background:linear-gradient(180deg,#1a2cab,#10208a);
      color:#fff; padding:10px 16px; border-radius:12px; font-weight:700; cursor:pointer;
      box-shadow: 0 4px 0 #06105e, 0 6px 18px rgba(0,0,0,.4); transition: transform .07s ease, box-shadow .07s ease;
    }
    .btn:hover{ filter:brightness(1.1); }
    .btn:active{ transform: translateY(2px); box-shadow:0 2px 0 #06105e; }
    .btn-pri{ background:linear-gradient(180deg,#f0c449,#d6a01c); color:#1b1300; border-color:#a37c14; box-shadow:0 4px 0 #6e5410, 0 6px 18px rgba(0,0,0,.4); }
    .btn-pri:active{ box-shadow:0 2px 0 #6e5410; }
    canvas{ display:block; width:100%; height:auto; border-radius:14px; background:#0b1a44; touch-action: manipulation; }
    .gauge-cap{ font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#9ab0ff;}
    .glow{ text-shadow: 0 0 12px rgba(255,255,255,.45), 0 0 32px rgba(232,183,58,.6); }
    .overlay{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none;}
    .overlay.show{ pointer-events:auto; }
    .card{
      max-width: 680px; padding: 22px 26px; text-align:center;
      background: rgba(2,8,40,.86);
      border:1px solid #3247c2; border-radius:18px; backdrop-filter: blur(6px);
    }
    .goal-flash{
      font-size: clamp(60px, 12vw, 160px); color:#fff;
      text-shadow: 0 0 18px #ffd24a, 0 0 42px #ff7b3a, 0 8px 0 #b8201d;
      animation: pop .9s ease-out forwards;
    }
    @keyframes pop{
      0%   { transform: scale(.5) rotate(-6deg); opacity:0;}
      30%  { transform: scale(1.15) rotate(2deg); opacity:1;}
      70%  { transform: scale(1.0) rotate(-1deg); opacity:1;}
      100% { transform: scale(1.1) rotate(0); opacity:0;}
    }
    .scoreflash{
      font-size: clamp(36px, 7vw, 84px); color:#fff;
      text-shadow: 0 0 14px rgba(255,255,255,.6), 0 6px 0 #b8201d;
      animation: pop 1s ease-out forwards;
    }
    .torp-warn{
      color:#ffd24a; font-weight:900;
      text-shadow:0 0 8px #ff5b1a, 0 0 24px #ff2a00;
      animation: pulse 0.6s infinite alternate;
    }
    @keyframes pulse{ from{opacity:.55} to{opacity:1} }
    .mute-btn{ width:44px; height:44px; border-radius:12px; display:inline-flex; align-items:center; justify-content:center; font-size:20px; }
    .field-grad-stop-1{ stop-color:#2d8a3e; }
    @media (max-width: 880px){
      .col-right { order: 2; }
    }
    .kbd{
      display:inline-grid; grid-auto-flow:column; gap:6px; align-items:center;
      background:#0b1330; border:1px solid #253169; padding:3px 10px; border-radius:8px;
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px;
    }
    .footer-hint{ font-size:12px; opacity:.75; text-align:center; padding:8px 0 16px; }
    .vignette{ pointer-events:none; position:absolute; inset:0; border-radius:14px;
      box-shadow: inset 0 0 80px rgba(0,0,0,.55); }
    /* Confetti pieces drawn on canvas, no DOM */
  </style>
</head>
<body>
  <div class="max-w-[1180px] mx-auto p-3 md:p-5">

    <!-- HEADER -->
    <header class="panel flex flex-wrap items-center gap-3 px-4 py-3 md:py-4 mb-3">
      <div class="flex items-center gap-3 flex-1 min-w-0">
        <div class="w-10 h-10 rounded-full flex items-center justify-center" style="background: radial-gradient(circle at 30% 30%, #f0c449, #b8201d 70%); border:2px solid #fff; box-shadow:0 0 18px rgba(255,180,40,.55);">
          <span class="text-lg arcade">⚉</span>
        </div>
        <div class="min-w-0">
          <h1 class="arcade text-xl md:text-3xl glow leading-none truncate">SIREN'S CALL</h1>
          <p class="text-xs md:text-sm opacity-80 -mt-0.5">The Boundary Snap Challenge</p>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <div class="pill">High <b id="highScore">0</b></div>
        <div class="pill">Streak <b id="streak">0</b></div>
        <div class="pill">Score <b id="score">0</b></div>
        <button id="muteBtn" class="btn mute-btn" title="Mute / Unmute" aria-label="Mute">🔊</button>
      </div>
    </header>

    <!-- PLAYFIELD -->
    <main id="playfield" class="panel p-3 relative select-none">
      <div class="relative">
        <canvas id="game" width="800" height="500"></canvas>
        <div class="vignette"></div>
        <div id="overlay" class="overlay show">
          <div class="card">
            <h2 class="arcade text-3xl md:text-5xl glow mb-1">SIREN'S CALL</h2>
            <p class="opacity-80 mb-4 text-sm">Stop the <b>Snap</b> in the green, then stop the <b>Power</b> in the bracket. Tap or press <span class="kbd">Space</span>.</p>
            <button id="startBtn" class="btn btn-pri arcade text-xl">START GAME</button>
          </div>
        </div>
        <div id="flash" class="overlay"></div>
      </div>

      <!-- THIN GAUGE STRIP -->
      <div class="gauge-strip mt-3 grid grid-cols-2 gap-3">
        <div>
          <div class="flex items-center justify-between"><span class="gauge-cap">Snap</span><span id="shotLabel" class="text-[11px] font-semibold text-amber-300">—</span></div>
          <canvas id="snapGauge" width="380" height="46" class="rounded-md mt-1"></canvas>
        </div>
        <div>
          <div class="flex items-center justify-between"><span class="gauge-cap">Power</span><span id="gaugeHint" class="text-[11px] opacity-80">Tap to kick</span></div>
          <canvas id="powerGauge" width="380" height="46" class="rounded-md mt-1"></canvas>
        </div>
      </div>
    </main>
  </div>

<script>
/* =====================================================================
   SIREN'S CALL — Boundary Snap Challenge
   Single-file vanilla JS arcade game.
   ===================================================================== */

(() => {
'use strict';

// ---------- DOM ----------
const canvas      = document.getElementById('game');
const ctx         = canvas.getContext('2d');
const snapCanvas  = document.getElementById('snapGauge');
const sg          = snapCanvas.getContext('2d');
const powerCanvas = document.getElementById('powerGauge');
const pg          = powerCanvas.getContext('2d');

const overlay   = document.getElementById('overlay');
const flashEl   = document.getElementById('flash');
const startBtn  = document.getElementById('startBtn');
const muteBtn   = document.getElementById('muteBtn');

const elScore   = document.getElementById('score');
const elStreak  = document.getElementById('streak');
const elHigh    = document.getElementById('highScore');
const elShot    = document.getElementById('shotLabel');
const elHint    = document.getElementById('gaugeHint');

// ---------- Const ----------
const W = canvas.width, H = canvas.height;
const COLOR = {
  stadium: '#020F81',
  grass:   '#2d8a3e',
  grassDk: '#1f6b2c',
  grassLt: '#3aa64e',
  chalk:   '#ffffff',
  post:    '#ffffff',
  postDk:  '#dde5ff',
  sherrin: '#e8b73a',
  sherrinDk:'#b8201d',
  red:     '#ff2a16',
  sky1:    '#0a1a6e',
  sky2:    '#244ad4',
  shadow:  'rgba(0,0,0,.35)',
};

const SHOT_TYPES = [
  { name:'Straight Shot',  dist:[20,35], angle:[0,10],   wind:[0,10]  },
  { name:'45° Arc',         dist:[35,50], angle:[30,50],  wind:[10,25] },
  { name:'Boundary Snap',   dist:[15,30], angle:[75,88],  wind:[25,40] },
];

const STATE = {
  IDLE:'idle', SHOT_INTRO:'intro', AIM_SNAP:'snap', AIM_POWER:'power',
  FLIGHT:'flight', RESULT:'result', GAMEOVER:'gameover'
};

// ---------- Game State ----------
const game = {
  state: STATE.IDLE,
  score: 0,
  streak: 0,
  high: +(localStorage.getItem('sirensCall.high') || 0),
  muted: localStorage.getItem('sirensCall.muted') === '1',
  shot: null,         // active shot scenario
  snap: { t:0, v:1, value:0 },         // oscillator 0..1, value when stopped
  power:{ t:0, v:1.3, value:0, dir:1 },// oscillator 0..1, value when stopped
  ball: null,
  particles: [],
  flashTimer: 0,
  flashText: '',
  flashSub: '',
  shakeT: 0,
  shotIntroT: 0,
  resultT: 0,
  captureFlash: null,
};
elHigh.textContent = game.high;
muteBtn.textContent = game.muted ? '🔇' : '🔊';

// ---------- Audio (Web Audio API) ----------
const Audio = (() => {
  let actx = null;
  function ensure(){
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ actx = null; }
    }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function noiseBuffer(seconds){
    const ac = ensure(); if (!ac) return null;
    const buf = ac.createBuffer(1, ac.sampleRate * seconds, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<d.length;i++) d[i] = Math.random()*2 - 1;
    return buf;
  }
  function siren(){
    if (game.muted) return;
    const ac = ensure(); if (!ac) return;
    const t0 = ac.currentTime;
    const out = ac.createGain();
    out.gain.value = 0.0;
    out.gain.setValueAtTime(0.0, t0);
    out.gain.linearRampToValueAtTime(0.18, t0+0.1);
    out.gain.linearRampToValueAtTime(0.18, t0+0.8);
    out.gain.linearRampToValueAtTime(0.0, t0+1.05);
    out.connect(ac.destination);
    for (const f of [220, 245]) {
      const o = ac.createOscillator();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(f, t0);
      o.frequency.linearRampToValueAtTime(f*1.04, t0+1.0);
      const g = ac.createGain(); g.gain.value = 0.5;
      o.connect(g); g.connect(out);
      o.start(t0); o.stop(t0+1.1);
    }
  }
  function kickThud(){
    if (game.muted) return;
    const ac = ensure(); if (!ac) return;
    const t0 = ac.currentTime;
    const buf = noiseBuffer(0.18);
    const src = ac.createBufferSource(); src.buffer = buf;
    const bp = ac.createBiquadFilter(); bp.type='lowpass'; bp.frequency.value=420;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0, t0);
    g.gain.linearRampToValueAtTime(0.45, t0+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+0.17);
    src.connect(bp); bp.connect(g); g.connect(ac.destination);
    src.start(t0); src.stop(t0+0.2);
    // Pitched thump component
    const o = ac.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(160, t0); o.frequency.exponentialRampToValueAtTime(60, t0+0.18);
    const og = ac.createGain(); og.gain.setValueAtTime(0.5, t0);
    og.gain.exponentialRampToValueAtTime(0.0001, t0+0.2);
    o.connect(og); og.connect(ac.destination);
    o.start(t0); o.stop(t0+0.22);
  }
  function tick(freq=900){
    if (game.muted) return;
    const ac = ensure(); if (!ac) return;
    const t0 = ac.currentTime;
    const o = ac.createOscillator(); o.type='square'; o.frequency.value=freq;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0, t0);
    g.gain.linearRampToValueAtTime(0.07, t0+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+0.06);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0+0.08);
  }
  function crowdCheer(){
    if (game.muted) return;
    const ac = ensure(); if (!ac) return;
    const t0 = ac.currentTime;
    const buf = noiseBuffer(2.0);
    const src = ac.createBufferSource(); src.buffer = buf;
    const bp = ac.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.setValueAtTime(700, t0);
    bp.frequency.linearRampToValueAtTime(1500, t0+0.6);
    bp.Q.value = 0.9;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0, t0);
    g.gain.linearRampToValueAtTime(0.32, t0+0.5);
    g.gain.linearRampToValueAtTime(0.22, t0+1.5);
    g.gain.linearRampToValueAtTime(0.0, t0+2.0);
    src.connect(bp); bp.connect(g); g.connect(ac.destination);
    src.start(t0); src.stop(t0+2.05);
    // High whoop
    const o = ac.createOscillator(); o.type='triangle';
    o.frequency.setValueAtTime(440, t0+0.05);
    o.frequency.linearRampToValueAtTime(660, t0+0.5);
    const og = ac.createGain(); og.gain.value = 0;
    og.gain.linearRampToValueAtTime(0.12, t0+0.2);
    og.gain.linearRampToValueAtTime(0.0, t0+1.0);
    o.connect(og); og.connect(ac.destination);
    o.start(t0+0.05); o.stop(t0+1.05);
  }
  function missSigh(){
    if (game.muted) return;
    const ac = ensure(); if (!ac) return;
    const t0 = ac.currentTime;
    const o = ac.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(420, t0);
    o.frequency.exponentialRampToValueAtTime(95, t0+0.9);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0, t0);
    g.gain.linearRampToValueAtTime(0.18, t0+0.1);
    g.gain.linearRampToValueAtTime(0.0, t0+1.0);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0+1.05);

    // Add a low buzz under it
    const o2 = ac.createOscillator(); o2.type='square';
    o2.frequency.setValueAtTime(120, t0); o2.frequency.exponentialRampToValueAtTime(50, t0+0.9);
    const g2 = ac.createGain(); g2.gain.setValueAtTime(0.0,t0);
    g2.gain.linearRampToValueAtTime(0.07, t0+0.15);
    g2.gain.linearRampToValueAtTime(0.0, t0+1.0);
    o2.connect(g2); g2.connect(ac.destination);
    o2.start(t0); o2.stop(t0+1.05);
  }
  function thunk(){
    if (game.muted) return;
    const ac = ensure(); if (!ac) return;
    const t0 = ac.currentTime;
    const o = ac.createOscillator(); o.type='triangle';
    o.frequency.setValueAtTime(180, t0); o.frequency.exponentialRampToValueAtTime(80, t0+0.2);
    const g = ac.createGain(); g.gain.setValueAtTime(0.4, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+0.25);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0+0.26);
  }
  return { ensure, siren, kickThud, tick, crowdCheer, missSigh, thunk };
})();

// ---------- Helpers ----------
const rand = (a,b) => a + Math.random()*(b-a);
const randInt = (a,b) => Math.floor(rand(a,b+1));
const clamp = (v,a,b) => Math.max(a, Math.min(b,v));
const lerp = (a,b,t) => a + (b-a)*t;
const sign = (v) => v < 0 ? -1 : 1;

// Smooth easing
const easeOut = t => 1 - Math.pow(1-t, 2);

// ---------- Shot generation ----------
function chooseShotTier(streak){
  // Weighted bias: streak 0 -> mostly straight; streak 5+ -> mostly hard.
  const s = streak;
  const wStraight = Math.max(0.05, 1.0 - s*0.15);
  const wArc      = 0.4 + Math.min(0.4, s*0.06);
  const wSnap     = 0.15 + Math.min(0.65, s*0.10);
  const total = wStraight + wArc + wSnap;
  let r = Math.random()*total;
  if (r < wStraight) return 0;
  r -= wStraight;
  if (r < wArc) return 1;
  return 2;
}
function generateShot(streak){
  const tierIdx = chooseShotTier(streak);
  const tier = SHOT_TYPES[tierIdx];
  const dist  = rand(tier.dist[0], tier.dist[1]);
  const angleMag = rand(tier.angle[0], tier.angle[1]);
  const side = Math.random() < 0.5 ? -1 : 1;     // left or right pocket
  const angle = angleMag * side;                  // negative = left of goals
  const windMag = rand(tier.wind[0], tier.wind[1]);
  const windDir = Math.random() < 0.5 ? -1 : 1;
  return {
    tier: tierIdx,
    name: tier.name,
    dist,                  // metres
    angle,                 // degrees, signed
    angleMag,
    side,
    wind: windMag * windDir, // signed km/h, +ve pushes right (positive x)
    windMag,
  };
}

// ---------- Field perspective drawing ----------
const FIELD = {
  horizonY: 100,
  groundBottomY: H - 20,
  centerX: W/2,
  goalSpacing: 6.4,         // metres between the two big posts
  behindOffset: 6.4,        // metres from main post to behind post (outside)
};

// Map a 3D point (x metres lateral from center, y metres altitude, z metres distance from goal) to screen
// shotDistance = how far away kicker is (so z ranges from shotDistance->0)
function project(xMet, yMet, zMet, shotDistance) {
  // t goes 0 at kicker (close to camera) to 1 at goal posts (far)
  const t = clamp(1 - zMet / shotDistance, 0, 1);
  // ground line - far is higher up on screen
  const groundY = lerp(FIELD.groundBottomY, FIELD.horizonY+30, t);
  // perspective scale (camera scale)
  const scale = lerp(1.0, 0.30, t);
  // horizontal spread scale - 1 metre at distance == this many pixels
  const pxPerMeterX = lerp(22, 9, t);
  const screenX = FIELD.centerX + xMet * pxPerMeterX;
  // altitude scale - pixels per metre vertically
  const pxPerMeterY = lerp(14, 7, t);
  const screenY = groundY - yMet * pxPerMeterY;
  return { sx: screenX, sy: screenY, scale, groundY, t, pxPerMeterX, pxPerMeterY };
}

function drawSky(){
  // Sky gradient above the horizon
  const g = ctx.createLinearGradient(0, 0, 0, FIELD.horizonY+10);
  g.addColorStop(0, '#040c4a');
  g.addColorStop(1, '#1c39b8');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, FIELD.horizonY+10);

  // Stadium silhouette behind the goals
  ctx.fillStyle = '#0a1660';
  ctx.beginPath();
  ctx.moveTo(0, FIELD.horizonY+10);
  for (let x=0; x<=W; x+=20){
    const y = FIELD.horizonY - 18 + Math.sin(x*0.045)*4 + Math.cos(x*0.013)*8;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, FIELD.horizonY+10);
  ctx.closePath();
  ctx.fill();

  // Stand lights
  for (let i=0;i<6;i++){
    const x = 60 + i*(W-120)/5;
    ctx.fillStyle = '#fff7c2';
    ctx.beginPath(); ctx.arc(x, FIELD.horizonY-8, 1.6, 0, Math.PI*2); ctx.fill();
    const grd = ctx.createRadialGradient(x, FIELD.horizonY-8, 0, x, FIELD.horizonY-8, 24);
    grd.addColorStop(0, 'rgba(255,247,194,.35)');
    grd.addColorStop(1, 'rgba(255,247,194,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(x, FIELD.horizonY-8, 24, 0, Math.PI*2); ctx.fill();
  }

  // Crowd noise dots
  for (let i=0;i<140;i++){
    const x = (i*97 + 13)%W;
    const y = FIELD.horizonY - 24 + ((i*7)%18);
    ctx.fillStyle = `rgba(${200 + (i%50)}, ${200 + (i*3%50)}, 255, .25)`;
    ctx.fillRect(x, y, 1.5, 1.5);
  }
}

function drawGround(){
  // Ground as a trapezoid: from far line up at horizon to wide at bottom.
  // Layered grass stripes for perspective.
  const stripes = 14;
  for (let i = stripes; i >= 0; i--){
    const t1 = i / stripes;
    const t2 = (i-1) / stripes;
    const y1 = lerp(FIELD.groundBottomY, FIELD.horizonY+30, t1);
    const y2 = lerp(FIELD.groundBottomY, FIELD.horizonY+30, Math.max(0,t2));
    const c1 = i%2===0 ? COLOR.grass : COLOR.grassDk;
    ctx.fillStyle = c1;
    // Trapezoid edges
    const halfW1 = lerp(W*0.55, W*0.10, t1);
    const halfW2 = lerp(W*0.55, W*0.10, Math.max(0,t2));
    ctx.beginPath();
    ctx.moveTo(FIELD.centerX - halfW1, y1);
    ctx.lineTo(FIELD.centerX + halfW1, y1);
    ctx.lineTo(FIELD.centerX + halfW2, y2);
    ctx.lineTo(FIELD.centerX - halfW2, y2);
    ctx.closePath();
    ctx.fill();
  }

  // Side dark falloff
  ctx.fillStyle = '#04106a';
  ctx.beginPath();
  ctx.moveTo(0, FIELD.horizonY+10);
  ctx.lineTo(FIELD.centerX - W*0.10, FIELD.horizonY+30);
  ctx.lineTo(FIELD.centerX - W*0.55, FIELD.groundBottomY);
  ctx.lineTo(0, FIELD.groundBottomY);
  ctx.closePath(); ctx.fill();

  ctx.beginPath();
  ctx.moveTo(W, FIELD.horizonY+10);
  ctx.lineTo(FIELD.centerX + W*0.10, FIELD.horizonY+30);
  ctx.lineTo(FIELD.centerX + W*0.55, FIELD.groundBottomY);
  ctx.lineTo(W, FIELD.groundBottomY);
  ctx.closePath(); ctx.fill();

  // 50m arc line drawn near kicker
  ctx.strokeStyle = 'rgba(255,255,255,.35)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(FIELD.centerX, FIELD.groundBottomY + 80, W*0.55, 60, 0, Math.PI, 0, false);
  ctx.stroke();

  // Center kicking line marker
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  ctx.fillRect(FIELD.centerX-1, FIELD.groundBottomY-8, 2, 8);
}

function drawGoals(shotDistance) {
  // Goal posts at z=0. Tall middle posts at x = ±halfGoal, behind posts at x = ±(halfGoal + behindOffset).
  const halfGoal = FIELD.goalSpacing / 2;
  const tallPostHeight = 11; // metres (tall enough)
  const behindPostHeight = 7;

  const xs = [
    {x: -(halfGoal + FIELD.behindOffset), h: behindPostHeight, kind:'behind'},
    {x: -halfGoal,                          h: tallPostHeight,   kind:'main'},
    {x:  halfGoal,                          h: tallPostHeight,   kind:'main'},
    {x:  (halfGoal + FIELD.behindOffset),  h: behindPostHeight, kind:'behind'},
  ];

  // base shadow
  const base = project(0, 0, 0, shotDistance);
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath();
  ctx.ellipse(base.sx, base.groundY+1, lerp(60, 22, 1), 6, 0, 0, Math.PI*2);
  ctx.fill();

  for (const p of xs) {
    const bottom = project(p.x, 0, 0, shotDistance);
    const top    = project(p.x, p.h, 0, shotDistance);
    const w = Math.max(2, 5 * bottom.scale);
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    ctx.fillRect(bottom.sx - w/2 + 2, bottom.sy - 2, w, 3);
    // post
    ctx.fillStyle = p.kind === 'main' ? COLOR.post : COLOR.postDk;
    ctx.fillRect(bottom.sx - w/2, top.sy, w, bottom.sy - top.sy);
    // cap
    ctx.fillStyle = '#ffeed4';
    ctx.fillRect(bottom.sx - w/2 - 1, top.sy - 3, w + 2, 3);
  }

  // Padding stripe near goal mouth (white line on ground between main posts)
  const lL = project(-halfGoal, 0, 0, shotDistance);
  const lR = project( halfGoal, 0, 0, shotDistance);
  ctx.strokeStyle = 'rgba(255,255,255,.7)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(lL.sx, lL.groundY);
  ctx.lineTo(lR.sx, lR.groundY);
  ctx.stroke();
}

// ---------- Wind indicator ----------
function drawWindSock(wind){
  // Wind sock in top-left of canvas
  const cx = 60, cy = 56;
  const pole = 36;
  // Pole
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx, cy+pole/2); ctx.lineTo(cx, cy-pole/2); ctx.stroke();
  // Sock orientation based on wind sign and magnitude
  const dir = sign(wind);
  const mag = Math.min(1, Math.abs(wind)/40);
  const sx = cx, sy = cy - pole/2 + 2;
  const dx = dir * (10 + 28*mag);
  const dy = lerp(8, -2, mag);
  // body (triangle)
  ctx.fillStyle = mag > 0.6 ? '#ff7b3a' : '#ffd24a';
  ctx.beginPath();
  ctx.moveTo(sx, sy-3);
  ctx.lineTo(sx + dx, sy + dy - 5);
  ctx.lineTo(sx + dx, sy + dy + 5);
  ctx.lineTo(sx, sy+3);
  ctx.closePath();
  ctx.fill();
  // stripe
  ctx.fillStyle = '#fff';
  ctx.fillRect(sx + dx*0.5, sy+dy*0.5 - 5, 2, 10);

  // Label
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('WIND', cx+22, cy-pole/2-4);
  ctx.font = '11px system-ui, sans-serif';
  ctx.fillStyle = '#ffd24a';
  ctx.fillText(`${Math.round(Math.abs(wind))} km/h ${dir>0?'→':'←'}`, cx+22, cy-pole/2+10);
}

// ---------- Ball ----------
function drawBall(b, shotDist){
  const p = project(b.x, b.y, b.z, shotDist);
  const r = Math.max(3, 14 * p.scale);

  // shadow on ground
  const sh = project(b.x, 0, b.z, shotDist);
  ctx.fillStyle = 'rgba(0,0,0,.30)';
  ctx.beginPath();
  ctx.ellipse(sh.sx, sh.groundY, r*0.9, Math.max(2, r*0.3), 0, 0, Math.PI*2);
  ctx.fill();

  // Trail
  for (let i = b.trail.length-1; i >=0; i--){
    const tp = b.trail[i];
    const pp = project(tp.x, tp.y, tp.z, shotDist);
    const fade = i / b.trail.length;
    const rr = r * (0.4 + fade*0.6);
    if (b.torpedo){
      ctx.fillStyle = `rgba(255, ${80 + 120*fade}, 30, ${0.18*fade + 0.05})`;
    } else {
      ctx.fillStyle = `rgba(255, 220, 90, ${0.10*fade})`;
    }
    ctx.beginPath(); ctx.ellipse(pp.sx, pp.sy, rr*1.1, rr*0.7, 0, 0, Math.PI*2); ctx.fill();
  }

  // Ball body (Sherrin oval)
  const grad = ctx.createRadialGradient(p.sx - r*0.3, p.sy - r*0.4, r*0.1, p.sx, p.sy, r*1.4);
  if (b.torpedo){
    grad.addColorStop(0, '#fff1c2');
    grad.addColorStop(0.4, '#ff8a3a');
    grad.addColorStop(1, '#9a0a00');
  } else {
    grad.addColorStop(0, '#ffe2a3');
    grad.addColorStop(0.55, COLOR.sherrin);
    grad.addColorStop(1, COLOR.sherrinDk);
  }
  ctx.fillStyle = grad;

  ctx.save();
  ctx.translate(p.sx, p.sy);
  // Rotation derived from horizontal velocity for visual spin
  ctx.rotate(b.spin);
  ctx.beginPath();
  ctx.ellipse(0, 0, r*1.3, r*0.85, 0, 0, Math.PI*2);
  ctx.fill();
  // Laces (white stripes)
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = Math.max(1, r*0.18);
  ctx.beginPath(); ctx.moveTo(-r*0.7, 0); ctx.lineTo(r*0.7, 0); ctx.stroke();
  ctx.lineWidth = Math.max(0.6, r*0.10);
  for (let i=-2;i<=2;i++){
    ctx.beginPath();
    ctx.moveTo(i*r*0.25, -r*0.18);
    ctx.lineTo(i*r*0.25,  r*0.18);
    ctx.stroke();
  }
  ctx.restore();
}

// Brief flash drawn over a gauge to confirm an input capture.
function gaugeFlash(ctx2d, x, w, t, h){
  if (!game.captureFlash) return;
  const age = (performance.now() - game.captureFlash.t0) / 220;  // 220ms
  if (age >= 1) { game.captureFlash = null; return; }
  if (game.captureFlash.kind !== t) return;
  const alpha = 1 - age;
  ctx2d.save();
  ctx2d.globalAlpha = alpha;
  ctx2d.fillStyle = '#fff';
  const px = x + game.captureFlash.pos * w;
  ctx2d.fillRect(px - 3, 0, 6, h);
  ctx2d.strokeStyle = '#fff';
  ctx2d.lineWidth = 2;
  ctx2d.strokeRect(px - 8 - age*14, 1, 16 + age*28, h - 2);
  ctx2d.restore();
}

function drawSnapGauge(){
  const w = snapCanvas.width, h = snapCanvas.height;
  sg.clearRect(0,0,w,h);
  sg.fillStyle = '#091d52';
  sg.fillRect(0,0,w,h);

  const padL = 6, padR = 6;
  const barW = w - padL - padR;
  const barH = h - 18;
  const x = padL, y = 4;

  // Coloured zones (HOOK -> CLEAN -> BANANA), wider green sweet spot
  const segs = 64;
  for (let i=0;i<segs;i++){
    const mid = (i + 0.5)/segs;
    const d = Math.abs(mid - 0.5)*2;
    let col;
    if (d < 0.10) col = '#7be07b';
    else if (d < 0.25) col = '#d9f07b';
    else if (d < 0.55) col = '#f0c449';
    else if (d < 0.82) col = '#f08049';
    else col = '#b8201d';
    sg.fillStyle = col;
    sg.fillRect(x + (i/segs)*barW, y, barW/segs + 0.6, barH);
  }

  // Centre tick
  sg.strokeStyle = '#fff';
  sg.lineWidth = 1;
  sg.beginPath();
  sg.moveTo(x + barW/2, y - 2);
  sg.lineTo(x + barW/2, y + barH + 2);
  sg.stroke();

  // Needle
  let nT;
  if (game.state === STATE.AIM_SNAP) nT = game.snap.t;
  else if (game.state === STATE.AIM_POWER || game.state === STATE.FLIGHT || game.state === STATE.RESULT) nT = game.snap.value;
  else nT = 0.5;
  sg.fillStyle = '#fff';
  sg.fillRect(x + nT*barW - 2, y - 3, 4, barH + 6);

  // Labels
  sg.fillStyle = '#9ab0ff';
  sg.font = 'bold 9px system-ui';
  sg.textAlign = 'left';   sg.fillText('HOOK',   x + 2,   h - 4);
  sg.textAlign = 'center'; sg.fillStyle = '#fff'; sg.fillText('CLEAN', x + barW/2, h - 4);
  sg.textAlign = 'right';  sg.fillStyle = '#9ab0ff'; sg.fillText('BANANA', x + barW - 2, h - 4);

  gaugeFlash(sg, x, barW, 'snap', y + barH + 4);
}

function drawPowerGauge(){
  const w = powerCanvas.width, h = powerCanvas.height;
  pg.clearRect(0,0,w,h);
  pg.fillStyle = '#091d52';
  pg.fillRect(0,0,w,h);

  const padL = 6, padR = 44;
  const barW = w - padL - padR;
  const barH = h - 18;
  const x = padL, y = 4;

  // Gradient zones
  const grd = pg.createLinearGradient(x, 0, x+barW, 0);
  grd.addColorStop(0,    '#b8201d');
  grd.addColorStop(0.5,  '#f08049');
  grd.addColorStop(0.85, '#7be07b');
  grd.addColorStop(0.95, '#7be07b');
  grd.addColorStop(1.0,  '#ff2a16');
  pg.fillStyle = grd;
  pg.fillRect(x, y, barW, barH);

  // Sweet-zone bracket
  if (game.shot){
    const req = requiredPowerForShot(game.shot);
    pg.fillStyle = 'rgba(255,255,255,.25)';
    pg.fillRect(x + req.lo*barW, y-2, (req.hi-req.lo)*barW, barH+4);
    pg.strokeStyle = '#fff';
    pg.lineWidth = 2;
    pg.strokeRect(x + req.lo*barW, y-2, (req.hi-req.lo)*barW, barH+4);
  }

  // Needle
  let pT;
  if (game.state === STATE.AIM_POWER) pT = game.power.t;
  else if (game.state === STATE.FLIGHT || game.state === STATE.RESULT) pT = game.power.value;
  else pT = 0;
  pg.fillStyle = '#fff';
  pg.fillRect(x + pT*barW - 2, y - 3, 4, barH + 6);

  // Labels
  pg.fillStyle = '#9ab0ff';
  pg.font = 'bold 9px system-ui';
  pg.textAlign = 'left';  pg.fillText('SOFT', x + 2, h - 4);
  pg.textAlign = 'right'; pg.fillText('TORP', x + barW - 2, h - 4);

  // Numeric readout
  pg.fillStyle = '#fff';
  pg.font = 'bold 14px system-ui, sans-serif';
  pg.textAlign = 'left';
  pg.fillText(`${Math.round(pT*100)}%`, x + barW + 6, y + barH/2 + 5);

  gaugeFlash(pg, x, barW, 'power', y + barH + 4);
}

// Each shot has a required power band scaled to its distance.
// 45m needs ~92.5% (90-95). Closer needs less, longer needs more.
function requiredPowerForShot(shot){
  // Calibrated so that 45m -> 0.925 centre. dist=15 -> ~0.48, dist=50 -> ~0.96.
  const center = clamp(0.475 + (shot.dist - 15) / 35 * 0.525, 0.50, 0.97);
  const width = 0.05; // ±2.5%
  let lo = center - width/2;
  let hi = center + width/2;
  // Boundary snap shots get a slightly wider band (easier on power, harder on angle)
  if (shot.tier === 2) { lo -= 0.015; hi += 0.015; }
  // Straight shots a touch tighter
  if (shot.tier === 0) { lo += 0.005; hi -= 0.005; }
  return { center, lo: clamp(lo,0,1), hi: clamp(hi,0,1) };
}

// ---------- Shot lifecycle ----------
function newShot(){
  game.shot = generateShot(game.streak);
  game.ball = null;
  game.snap = { t: 0, v: 1.05 + Math.min(0.9, game.streak*0.07), value: 0.5 };
  game.power = { t: 0, v: 1.0 + Math.min(1.1, game.streak*0.08), value: 0, dir: 1 };
  game.flashTimer = 0;
  game.flashText = '';
  game.particles.length = 0;
  game.shotIntroT = 0;
  game.state = STATE.SHOT_INTRO;
  const distStr = `${Math.round(game.shot.dist)}m`;
  const sideStr = game.shot.angle === 0 ? '0°' : `${Math.abs(Math.round(game.shot.angle))}° ${game.shot.side<0?'L':'R'}`;
  const windStr = `${Math.round(game.shot.windMag)}${game.shot.wind<0?'←':'→'}`;
  elShot.textContent = `${distStr} · ${sideStr} · ${windStr}`;
  elHint.textContent = 'Stop the SNAP!';
  Audio.siren();
}

function startKick(){
  // Snap stopped first, then power. Initialise.
  // Already done — call when first click stops snap and we enter power phase.
}

function commitKick(){
  const shot = game.shot;
  const snapVal = game.snap.value;          // 0..1, 0.5 = perfect
  const snapOff = (snapVal - 0.5) * 2;      // -1..+1 (sign = curve direction)
  const power   = clamp(game.power.value, 0, 1);
  const req = requiredPowerForShot(shot);

  // Expected total flight distance is proportional to power.
  // At power == req.center, expectedDist == shot.dist (reaches the goals).
  // Under-powered: short. Over-powered: goes long & drifts more in wind.
  const expectedDist = clamp((power / req.center) * shot.dist, 4, shot.dist * 1.25);
  const flightFrames = 70;                  // visual flight time
  const vForward = expectedDist / flightFrames;

  // Lateral push budgets (metres over flight) -> per-frame contributions
  // Wind: 30 km/h side wind should drift ~3m on a free kick.
  const windPushPerFrame = (shot.wind / 30) * 3 / (flightFrames * 0.5); // scaled by avg(tFlight)
  // Curve: max snap offset (±1) curves ±2.5m at apex.
  const curveMagPerFrame = 2.5 / (flightFrames * 0.4);
  const curvePerFrame = snapOff * curveMagPerFrame;
  // Natural drift from angle: kicker on the boundary tends to fade further toward the boundary.
  // 80° boundary kick should drift ~3.5m unless curved back.
  const aimRad = shot.angle * Math.PI/180;
  const driftPerFrame = Math.sin(aimRad) * 3.5 / flightFrames;

  // Torpedo check
  const isTorpedo = (power >= 0.98) && (Math.abs(snapOff) < 0.05);

  game.ball = {
    x: 0, y: 0.0, z: shot.dist,
    vForward,
    expectedDist,
    distTravelled: 0,
    windPushPerFrame,
    curvePerFrame,
    driftPerFrame,
    shotDist: shot.dist,
    startZ: shot.dist,
    landed: false,
    trail: [],
    spin: 0,
    torpedo: isTorpedo,
    power,
    snapOff,
    // Apex altitude scales with power slightly and inversely with distance
    apex: clamp(6 + power*8 - shot.dist*0.04, 4, 18),
  };

  Audio.kickThud();
  if (isTorpedo) Audio.thunk();
  game.shakeT = 12;
  game.state = STATE.FLIGHT;
  elHint.textContent = isTorpedo ? 'TORPEDO! Maximum velocity!' : 'Ball away — watch it fly!';
}

// Physics step for the ball in flight
function stepBall(dt){
  const b = game.ball;
  if (!b || b.landed) return;

  // Forward movement
  b.z -= b.vForward;
  b.distTravelled += b.vForward;

  // Flight progress relative to expected (power-determined) flight distance
  const tFlight = clamp(b.distTravelled / b.expectedDist, 0, 1);
  // Parabolic altitude based on flight progress (so under-powered shots come down short)
  b.y = b.apex * 4 * tFlight * (1 - tFlight);

  // Lateral contributions
  const curveT = 4 * tFlight * (1 - tFlight);     // peaks midflight
  b.x += b.windPushPerFrame * tFlight;            // wind impact grows late in flight
  b.x += b.curvePerFrame * curveT * 1.6;          // curve dominates mid-flight
  b.x += b.driftPerFrame;                         // constant drift from angle

  // Snap miss adds small jitter at high offsets
  if (Math.abs(b.snapOff) > 0.35 && tFlight < 0.95) {
    b.x += (Math.random() - 0.5) * 0.02 * Math.abs(b.snapOff);
  }

  // Spin for visual
  b.spin += 0.45;

  // Trail
  b.trail.push({ x: b.x, y: b.y, z: Math.max(b.z, 0) });
  if (b.trail.length > 24) b.trail.shift();

  // Torpedo fire particles
  if (b.torpedo && Math.random() < 0.65) spawnFireParticle(b);

  // Landing: flight progress complete OR reached goal line.
  if (tFlight >= 1 || b.z <= 0) {
    b.y = 0;
    b.z = Math.max(b.z, 0);
    b.landed = true;
    resolveShot(b);
  }
}

// ---------- Particles ----------
function spawnGoalConfetti() {
  const colors = ['#e8b73a','#b8201d','#ffffff','#7be07b','#3aa6ff','#ff7b3a'];
  for (let i=0;i<140;i++){
    game.particles.push({
      kind:'confetti',
      x: W/2 + (Math.random()-0.5)*60,
      y: H/2 + (Math.random()-0.5)*40,
      vx: (Math.random()-0.5)*9,
      vy: -Math.random()*9 - 2,
      g: 0.3,
      life: 60 + Math.random()*60,
      age: 0,
      color: colors[(Math.random()*colors.length)|0],
      rot: Math.random()*Math.PI*2,
      vr: (Math.random()-0.5)*0.4,
      w: 4 + Math.random()*5,
      h: 2 + Math.random()*4,
    });
  }
}
function spawnFireParticle(b){
  const p = project(b.x, b.y, b.z, b.startZ);
  game.particles.push({
    kind:'fire',
    x: p.sx + (Math.random()-0.5)*4,
    y: p.sy + (Math.random()-0.5)*4,
    vx: (Math.random()-0.5)*0.6,
    vy: 0.4 + Math.random()*0.6,
    life: 20 + Math.random()*14,
    age: 0,
    r: 3 + Math.random()*4,
  });
}
function stepParticles(){
  for (let i=game.particles.length-1;i>=0;i--){
    const p = game.particles[i];
    p.age++;
    if (p.kind === 'confetti'){
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
    } else if (p.kind === 'fire'){
      p.x += p.vx;
      p.y += p.vy;
      p.r *= 0.94;
    }
    if (p.age > p.life) game.particles.splice(i,1);
  }
}
function drawParticles(){
  for (const p of game.particles){
    if (p.kind === 'confetti'){
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    } else if (p.kind === 'fire'){
      const a = 1 - p.age/p.life;
      ctx.fillStyle = `rgba(255, ${60 + 160*a}, 30, ${a*0.9})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    }
  }
}

// ---------- Scoring resolution ----------
function resolveShot(b){
  // At final z=0 evaluate ball.x against post positions
  const halfGoal = FIELD.goalSpacing/2;             // 3.2 m
  const behindEdge = halfGoal + FIELD.behindOffset; // 9.6 m
  const x = b.x;
  let outcome = 'out';
  // If ball landed before reaching the goal line, it's short.
  if (b.z > 0.5) {
    outcome = 'short';
  } else if (Math.abs(x) < halfGoal - 0.15) {
    outcome = 'goal';
  } else if (Math.abs(x) < halfGoal + 0.15) {
    // grazed the post
    outcome = 'post';
  } else if (Math.abs(x) < behindEdge) {
    outcome = 'behind';
  } else {
    outcome = 'out';
  }

  // Result handling
  let points = 0;
  let label = '', sub = '';
  if (outcome === 'goal'){
    points = 6;
    label = 'GOAL!';
    sub = b.torpedo ? 'TORPEDO! 6 POINTS' : '6 POINTS';
    game.score += 6;
    game.streak += 1;
    spawnGoalConfetti();
    Audio.crowdCheer();
  } else if (outcome === 'post'){
    // Post hit -> behind (1) per rules
    points = 1;
    label = 'BEHIND';
    sub = 'Hit the post — through for a minor';
    game.score += 1;
    Audio.thunk();
    Audio.missSigh();
    game.state = STATE.RESULT;
  } else if (outcome === 'behind'){
    points = 1;
    label = 'BEHIND';
    sub = '1 POINT — streak broken';
    game.score += 1;
    Audio.missSigh();
  } else if (outcome === 'short'){
    label = 'TOO SHORT!';
    sub = 'Didn\'t make the distance';
    Audio.missSigh();
  } else {
    label = 'OUT ON THE FULL';
    sub = 'Missed the lot';
    Audio.missSigh();
  }

  game.flashText = label;
  game.flashSub  = sub;
  game.flashTimer = 90;     // ~1.5s @ 60fps
  game.resultT = 0;

  // Update displays
  elScore.textContent = game.score;
  elStreak.textContent = game.streak;
  if (game.score > game.high){
    game.high = game.score;
    localStorage.setItem('sirensCall.high', String(game.high));
    elHigh.textContent = game.high;
  }

  if (outcome === 'goal'){
    // Set up next shot after delay
    game.state = STATE.RESULT;
    setTimeout(() => {
      if (game.state === STATE.RESULT) newShot();
    }, 1700);
  } else {
    // Game over
    game.state = STATE.RESULT;
    setTimeout(() => {
      gameOver();
    }, 1700);
  }
}

function gameOver(){
  game.state = STATE.GAMEOVER;
  Audio.siren();
  showOverlay(`
    <h2 class="arcade text-4xl md:text-5xl glow mb-1" style="color:#ffd24a">FULL TIME</h2>
    <p class="opacity-90 mb-3">The siren has sounded. Final tally:</p>
    <div class="flex gap-4 justify-center mb-4 flex-wrap">
      <div class="pill text-base">Score <b>${game.score}</b></div>
      <div class="pill text-base">Streak <b>${game.streak}</b></div>
      <div class="pill text-base">High <b>${game.high}</b></div>
    </div>
    <button id="againBtn" class="btn btn-pri arcade text-xl">PLAY AGAIN</button>
  `);
  document.getElementById('againBtn').addEventListener('click', startGame);
}

}
function showOverlay(html){
  overlay.innerHTML = `<div class="card">${html}</div>`;
  overlay.classList.add('show');
}

// ---------- Game flow ----------
function startGame(){
  Audio.ensure();
  hideOverlay();
  game.score = 0;
  game.streak = 0;
  elScore.textContent = 0;
  elStreak.textContent = 0;
  newShot();
}

function handleAction(){
  // Single button "kick" action drives the state machine.
  if (game.state === STATE.SHOT_INTRO){
    // Allow skip-forward to the snap gauge if player is ready.
    game.state = STATE.AIM_SNAP;
    elHint.textContent = 'Stop the SNAP!';
    Audio.tick(700);
    return;
  }
  if (game.state === STATE.AIM_SNAP){
    game.snap.value = game.snap.t;
    game.captureFlash = { kind:'snap',  pos: game.snap.t,  t0: performance.now() };
    game.state = STATE.AIM_POWER;
    elHint.textContent = 'Stop the POWER!';
    Audio.tick(900);
    return;
  }
  if (game.state === STATE.AIM_POWER){
    game.power.value = game.power.t;
    game.captureFlash = { kind:'power', pos: game.power.t, t0: performance.now() };
    Audio.tick(1100);
    commitKick();
    return;
  }
  if (game.state === STATE.GAMEOVER){
    startGame();
    return;
  }
  // FLIGHT and RESULT: ignore input
}

// ---------- Update loop ----------
let lastT = 0;
function loop(t){
  const dt = Math.min(0.033, (t - lastT)/1000) || 0.016;
  lastT = t;

  // Step state
  if (game.state === STATE.AIM_SNAP){
    game.snap.t += game.snap.v * dt;
    if (game.snap.t > 1) { game.snap.t = 1 - (game.snap.t - 1); game.snap.v *= -1; }
    if (game.snap.t < 0) { game.snap.t = -game.snap.t; game.snap.v *= -1; }
  } else if (game.state === STATE.AIM_POWER){
    game.power.t += game.power.v * dt * game.power.dir;
    if (game.power.t >= 1){ game.power.t = 1; game.power.dir = -1; }
    if (game.power.t <= 0){ game.power.t = 0; game.power.dir =  1; }
  } else if (game.state === STATE.FLIGHT){
    stepBall(dt);
  } else if (game.state === STATE.SHOT_INTRO){
    game.shotIntroT += dt;
    if (game.shotIntroT > 1.1){
      game.state = STATE.AIM_SNAP;
      elHint.textContent = 'Stop the SNAP — get it in the green centre.';
      Audio.tick(700);
    }
  }

  stepParticles();
  if (game.flashTimer > 0) game.flashTimer--;
  if (game.shakeT > 0) game.shakeT--;

  draw();
  requestAnimationFrame(loop);
}

function draw(){
  // Camera shake offset
  let sx = 0, sy = 0;
  if (game.shakeT > 0){
    const m = game.shakeT/12;
    sx = (Math.random()-0.5) * 8 * m;
    sy = (Math.random()-0.5) * 6 * m;
  }
  ctx.save();
  ctx.translate(sx, sy);

  drawSky();
  drawGround();

  // Behind kicker silhouette at bottom of canvas (out-of-focus shoulders)
  ctx.fillStyle = 'rgba(0,0,0,.55)';
  ctx.beginPath();
  ctx.moveTo(0, H);
  ctx.lineTo(0, H-30);
  ctx.quadraticCurveTo(W*0.25, H-70, W*0.45, H-46);
  ctx.lineTo(W*0.55, H-46);
  ctx.quadraticCurveTo(W*0.75, H-70, W, H-30);
  ctx.lineTo(W, H);
  ctx.closePath(); ctx.fill();

  if (game.shot) {
    drawGoals(game.shot.dist);
    drawWindSock(game.shot.wind);

    // Ball
    if (game.ball){
      drawBall(game.ball, game.shot.dist);
    } else if (game.state === STATE.SHOT_INTRO || game.state === STATE.AIM_SNAP || game.state === STATE.AIM_POWER){
      // Pre-kick ball at the kicker
      drawBall({
        x: 0, y: 0.3, z: game.shot.dist,
        startZ: game.shot.dist,
        trail: [],
        spin: 0,
        torpedo: false,
      }, game.shot.dist);
    }
  } else {
    // Idle: draw simple posts straight ahead
    drawGoals(40);
  }

  // Torpedo indicator overlay
  if (game.ball && game.ball.torpedo){
    ctx.fillStyle = '#ff5b1a';
    ctx.font = 'bold 22px Impact, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('TORPEDO 🔥', W-14, 26);
  }

  drawParticles();

  // Flash text (goal/behind)
  if (game.flashTimer > 0 && game.flashText){
    const t = game.flashTimer / 90;
    const alpha = clamp(t*1.4, 0, 1);
    const isGoal = /GOAL/.test(game.flashText);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center';
    ctx.font = `${isGoal ? 'bold 96px' : 'bold 56px'} Impact, Haettenschweiler, sans-serif`;
    ctx.lineWidth = 8; ctx.strokeStyle = '#7a1010';
    ctx.fillStyle = isGoal ? '#fff' : '#ffd24a';
    ctx.strokeText(game.flashText, W/2, H/2);
    ctx.fillText(game.flashText, W/2, H/2);
    ctx.font = 'bold 22px Impact, sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText(game.flashSub, W/2, H/2 + 36);
    ctx.restore();
  }

  ctx.restore();

  // Gauge strip
  drawSnapGauge();
  drawPowerGauge();
}

// ---------- Input ----------
function bindInputs(){
  // Capture pointer events on the entire playfield (canvas + gauges + padding)
  // so taps anywhere inside the panel register, not just on the canvas pixels.
  const playfield = document.getElementById('playfield');
  const tapZones = [playfield, canvas, snapCanvas, powerCanvas];
  for (const el of tapZones){
    if (!el) continue;
    el.addEventListener('pointerdown', e => {
      // Ignore taps on the start/again buttons or the mute control
      const tag = e.target && e.target.closest ? e.target.closest('button') : null;
      if (tag) return;
      e.preventDefault();
      handleAction();
    });
  }
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      handleAction();
    } else if (e.code === 'KeyR') {
      e.preventDefault();
      if (game.state !== STATE.IDLE) startGame();
    } else if (e.code === 'KeyM') {
      toggleMute();
    }
  });
  startBtn.addEventListener('click', startGame);
  muteBtn.addEventListener('click', toggleMute);
}
function toggleMute(){
  game.muted = !game.muted;
  localStorage.setItem('sirensCall.muted', game.muted ? '1' : '0');
  muteBtn.textContent = game.muted ? '🔇' : '🔊';
}

// ---------- Boot ----------
function fitCanvas(){
  // canvas scales naturally with CSS width:100%; logical pixels stay 800x500.
  // But re-render once to handle initial layout.
  draw();
}

bindInputs();
fitCanvas();
window.addEventListener('resize', fitCanvas);
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
